syntax = "proto3";

option csharp_namespace = "TestAgentGrpc";

package testagent;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// =============================================================================
// TestController Service — hosted by the Controller.
// =============================================================================
service TestControllerService {
  rpc Register          (TestAgentRef)          returns (google.protobuf.Empty);
  rpc UnRegister        (TestAgentRef)          returns (google.protobuf.Empty);
  rpc UpdateClientState (TestAgentRef)          returns (google.protobuf.Empty);
  rpc PushExecutionEvents (stream ExecutionEvent) returns (google.protobuf.Empty);
  rpc Heartbeat (HeartbeatRequest) returns (google.protobuf.Empty);
}

// =============================================================================
// TestAgent Service — hosted by each agent node.
// =============================================================================
service TestAgentService {
  rpc GetState           (google.protobuf.Empty) returns (StateReply);
  rpc RunCommand         (RunCommandRequest)     returns (RunCommandReply);
  rpc GetLastExitCode    (google.protobuf.Empty) returns (ExitCodeReply);
  rpc GetLastError       (google.protobuf.Empty) returns (ErrorReply);
  rpc TerminateExecution (google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc RunCommandStreamed (RunCommandRequest)     returns (stream ExecutionEvent);
  rpc SubscribeAgentEvents (google.protobuf.Empty) returns (stream ExecutionEvent);
  rpc GetExecutionHistory (ExecutionHistoryRequest) returns (ExecutionHistoryReply);
  rpc GetAgentSnapshot (google.protobuf.Empty) returns (AgentSnapshot);
}

// =============================================================================
// Messages
// =============================================================================

message TestAgentRef {
  string name     = 1;
  AgentState state = 2;
  string endpoint  = 3;  // Agent's gRPC callback address (e.g. "http://AGENT01:5200")
}

enum AgentState {
  AGENT_STATE_READY    = 0;
  AGENT_STATE_RUNNING  = 1;
  AGENT_STATE_INACTIVE = 2;
}

message StateReply {
  AgentState state = 1;
}

message RunCommandRequest {
  string command        = 1;
  string arguments      = 2;
  bool   is_reboot      = 3;
  string execution_id   = 4;
  int32  timeout_seconds = 5;
  string user_name      = 6;
  string password        = 7;
}

message RunCommandReply {
  bool   accepted     = 1;
  string execution_id = 2;
  string message      = 3;
}

message ExitCodeReply {
  int32 exit_code = 1;
}

message ErrorReply {
  string error_message = 1;
}

message ExecutionEvent {
  string                    execution_id = 1;
  string                    agent_name   = 2;
  google.protobuf.Timestamp timestamp    = 3;
  ExecutionEventType        event_type   = 4;
  string     output_line    = 5;
  OutputKind output_kind    = 6;
  int32      exit_code      = 7;
  string     error_message  = 8;
  AgentState agent_state    = 9;
  string     command        = 10;
  string     arguments      = 11;
  double     progress_pct   = 12;
  string     detail         = 13;
  ResourceMetrics metrics   = 14;
}

enum ExecutionEventType {
  EVENT_UNKNOWN       = 0;
  EVENT_QUEUED        = 1;
  EVENT_STARTED       = 2;
  EVENT_STDOUT_LINE   = 3;
  EVENT_STDERR_LINE   = 4;
  EVENT_PROGRESS      = 5;
  EVENT_COMPLETED     = 6;
  EVENT_FAILED        = 7;
  EVENT_TERMINATED    = 8;
  EVENT_STATE_CHANGED = 9;
  EVENT_HEARTBEAT     = 10;
}

enum OutputKind {
  OUTPUT_STDOUT = 0;
  OUTPUT_STDERR = 1;
}

message ResourceMetrics {
  double cpu_usage_pct        = 1;
  double memory_used_mb       = 2;
  double memory_total_mb      = 3;
  double disk_free_gb         = 4;
  int32  active_process_count = 5;
}

message HeartbeatRequest {
  string          agent_name = 1;
  AgentState      state      = 2;
  ResourceMetrics metrics    = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message ExecutionHistoryRequest {
  int32 max_results    = 1;
  string filter_command = 2;
}

message ExecutionHistoryReply {
  repeated ExecutionRecord records = 1;
}

message ExecutionRecord {
  string execution_id                = 1;
  string command                     = 2;
  string arguments                   = 3;
  google.protobuf.Timestamp started  = 4;
  google.protobuf.Timestamp finished = 5;
  int32  exit_code                   = 6;
  string error_message               = 7;
  ExecutionOutcome outcome           = 8;
  repeated string stdout_lines       = 9;
  repeated string stderr_lines       = 10;
}

enum ExecutionOutcome {
  OUTCOME_UNKNOWN    = 0;
  OUTCOME_SUCCESS    = 1;
  OUTCOME_FAILED     = 2;
  OUTCOME_TERMINATED = 3;
  OUTCOME_TIMED_OUT  = 4;
}

message AgentSnapshot {
  string          agent_name           = 1;
  AgentState      state                = 2;
  string          current_activity     = 3;
  string          current_execution_id = 4;
  string          current_command      = 5;
  google.protobuf.Timestamp execution_started = 6;
  ResourceMetrics metrics              = 7;
  int32           executions_completed = 8;
  int32           executions_failed    = 9;
  google.protobuf.Timestamp agent_started = 10;
}
