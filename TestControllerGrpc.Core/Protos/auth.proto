syntax = "proto3";

option csharp_namespace = "TestControllerGrpc";

package rbac;

// =============================================================================
// Auth Service — Login, Logout, ChangePassword
// =============================================================================
service AuthGrpcService {
  rpc Login          (LoginRequest)          returns (LoginResponse);
  rpc LoginAsGuest   (LoginAsGuestRequest)   returns (LoginResponse);
  rpc Logout         (LogoutRequest)         returns (LogoutResponse);
  rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordResponse);
}

// =============================================================================
// SystemMode Service — Get/Switch mode
// =============================================================================
service SystemModeGrpcService {
  rpc GetMode          (GetModeRequest)          returns (GetModeResponse);
  rpc SwitchToSecured  (SwitchToSecuredRequest)  returns (SwitchModeResponse);
  rpc SwitchToDefault  (SwitchToDefaultRequest)  returns (SwitchModeResponse);
}

// =============================================================================
// Messages
// =============================================================================

message LoginRequest {
  string username    = 1;
  string password    = 2;
  string client_kind = 3;  // "Wpf" | "Web" | "Cli"
}

message LoginAsGuestRequest {
  string client_kind = 1;
}

message LoginResponse {
  bool   success              = 1;
  string token                = 2;
  string role                 = 3;
  bool   must_change_password = 4;
  string error                = 5;
}

message LogoutRequest {
  string token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password     = 2;
}

message ChangePasswordResponse {
  bool   success = 1;
  string error   = 2;
}

message GetModeRequest {}

message GetModeResponse {
  bool   secured = 1;  // true = Secured mode, false = Default mode
}

message SwitchToSecuredRequest {
  string admin_username = 1;
  string admin_email    = 2;
  string admin_password = 3;
}

message SwitchToDefaultRequest {
  string confirmation = 1;  // Must be exactly "DISABLE RBAC"
}

message SwitchModeResponse {
  bool   success = 1;
  string error   = 2;
}
